<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <style>
    .text-bg {
      fill: #ffffff;
    }
    .text-main {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-size: 88px;
      font-weight: 800;
      fill: #1a4b60;
    }
    .text-accent {
      fill: #0e2d3b;
    }
  </style>
  <g transform="translate(10, 10)">
    <!-- Weißer Hintergrundrahmen / Box entsprechend der Vorlage -->
    <rect class="text-bg" x="0" y="0" width="520" height="160" rx="12" ry="12" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.06))" />
    
    <!-- Text "Re:Print" mit integriertem Doppelpunkt -->
    <text x="45" y="112" class="text-main">
      <tspan class="text-accent">Re</tspan><tspan class="text-accent">:</tspan>Print
    </text>
  </g>
</svg>
